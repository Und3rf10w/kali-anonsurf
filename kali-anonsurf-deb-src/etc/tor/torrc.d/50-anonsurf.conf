# Managed by kali-anonsurf, installed to /etc/tor/torrc.d/50-anonsurf.conf
#
# This fragment is pulled in by the line
#     %include /etc/tor/torrc.d/*.conf
# which the package's postinst script adds to /etc/tor/torrc. The original
# torrc is never replaced, so bridges, pluggable transports, hidden services
# and ControlPort settings survive an anonsurf install.

# .onion names are mapped into this range so that iptables can redirect them.
VirtualAddrNetwork 10.192.0.0/10
AutomapHostsOnResolve 1
AutomapHostsSuffixes .onion,.exit

# Listeners used by anonsurf. The distribution package already provides
# SocksPort 9050 and a control socket, so neither is repeated here.
TransPort 127.0.0.1:9040
DNSPort 127.0.0.1:53

ClientOnly 1
SafeLogging 1
